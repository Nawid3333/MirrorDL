# Submits a release's MSIX package to the Microsoft Store. release.yml builds the package and keeps it
# on the run as the store-package artifact; this takes it from there, in the same run. Called by
# auto-release.yml once it has published the GitHub release, and by release.yml for a release
# published by hand - in both cases only when the repository variable STORE_PRODUCT_ID is set, the
# last step of the setup (docs/microsoft-store.md) and the switch that turns the Store on.
#
# A failure here leaves the GitHub release as it is: fix the cause (an expired key, a submission
# edited in Partner Center), then re-run this job. The Store certifies a submission before it goes
# live, which takes from hours to a few days; Partner Center shows where it is.
name: Microsoft Store

on:
  workflow_call:
    secrets:
      AZURE_AD_TENANT_ID:
        required: false
      AZURE_AD_APPLICATION_CLIENT_ID:
        required: false
      AZURE_AD_APPLICATION_SECRET:
        required: false
      SELLER_ID:
        required: false

permissions:
  contents: read

jobs:
  submit:
    name: Submit to the Microsoft Store
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-package
          path: package

      # Microsoft's action: installs the Microsoft Store Developer CLI (msstore).
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Sign in to Partner Center
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $missing = 'TENANT_ID', 'SELLER_ID', 'CLIENT_ID', 'CLIENT_SECRET' | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            Write-Output "::error::STORE_PRODUCT_ID is set, but these secrets are missing: $($missing -join ', ') (docs/microsoft-store.md)."
            exit 1
          }
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Submit the package
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          msstore publish (Resolve-Path package/MirrorDL-x64.msix).Path -id $env:PRODUCT_ID
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
