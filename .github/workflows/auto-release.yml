# Releases main automatically, driven by Conventional Commits: once CI has passed on a push to main,
# the commits since the last release tag decide. Any `fix:` or `perf:` makes a patch release, any
# `feat:` a minor one, a `!` after the type (`feat!:`) or a "BREAKING CHANGE:" footer a major one.
# Everything else (chore:, ci:, docs:, test:, refactor:, build:, style:) releases nothing - and so does
# any commit when nothing that goes into the program changed (the list is in the version job): a
# fix: to a workflow or a test is no reason for a new version.
#
# The release is created as a draft for the commit CI tested; release.yml builds the zips and attaches
# them, and only then is the release published, so nobody sees a release without its downloads.
# Once the Store is set up (STORE_PRODUCT_ID, docs/microsoft-store.md), store.yml then submits the
# same version to the Microsoft Store. It comes last on purpose: a Store problem never holds up the
# GitHub release.
#
# Runs on workflow_run, not push: a commit is released only after CI passed on it. The default token
# is enough: the draft, the files and the publishing all happen in this run, so no other workflow has
# to start from them (a release published with the default token does not start release.yml's own
# release: trigger - GitHub's loop prevention - which is right, since it is built already).
name: Auto release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Decide the next version
    # Only a green CI run of a push to main of this repository: not a pull request's, not a fork's.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the draft release
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # the tags and the commits since the last one
          persist-credentials: false

      - name: Read the commits since the last release
        id: next
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Above the generated list of changes, on every release.
          DOWNLOADS: >-
            **Downloads:** `MirrorDL-win-x64.zip` is the window app, `mirrordl-terminal-win-x64.zip` the terminal
            program; unzip and start. Both need Windows 10 (1809 or newer) or 11, 64-bit, and the
            [.NET 10 Runtime](https://dotnet.microsoft.com/download/dotnet/10.0). The window app is also in the
            Microsoft Store, which needs nothing else and updates it by itself.
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$SHA" 2>/dev/null || true)
          range=${last:+$last..}$SHA
          echo "Last release: ${last:-none}; looking at $range"

          bump='none'
          while IFS= read -r -d '' message; do
            subject=${message%%$'\n'*}
            if [[ $subject =~ ^[a-z]+(\([^\)]*\))?!: ]] || grep -qE '^BREAKING[ -]CHANGE:' <<< "$message"; then
              bump='major'
              break
            elif [[ $subject =~ ^feat(\([^\)]*\))?: ]]; then
              bump='minor'
            elif [[ $subject =~ ^(fix|perf)(\([^\)]*\))?: ]] && [ "$bump" = none ]; then
              bump='patch'
            fi
          # -z ends every message with a NUL and nothing else; a %x00 in the format would be followed
          # by git's own newline, so every message after the first would start with an empty line.
          done < <(git log -z --format='%B' "$range")

          if [ "$bump" = none ]; then
            echo "No fix:, perf: or feat: commit since ${last:-the start}: nothing to release."
            exit 0
          fi
          # And only if something that goes into the program changed: a fix: to a workflow, a test or the
          # docs gives users nothing new. These are the files build.ps1 builds the zips and the Store
          # package from (the projects take the two icons from assets/); add to it when that changes.
          program=(MirrorDL.Core MirrorDL MirrorDL.App assets/mirrordl.ico assets/logo-64.png
                   Directory.Build.props global.json build.ps1)
          if [ -n "$last" ] && git diff --quiet "$last" "$SHA" -- "${program[@]}"; then
            echo "Nothing that goes into the program changed since $last: nothing to release."
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case $bump in
            major) major=$((major + 1)) minor=0 patch=0 ;;
            minor) minor=$((minor + 1)) patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"
          echo "A $bump release: $tag"

          # A draft left by a failed earlier run of this version is replaced.
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)" = true ]; then
            gh release delete "$tag" --yes
          fi
          notes=(--notes "$DOWNLOADS" --generate-notes)
          if [ -n "$last" ]; then notes+=(--notes-start-tag "$last"); fi
          gh release create "$tag" --draft --target "$SHA" --title "MirrorDL ${tag#v}" "${notes[@]}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write # the zips onto the release
    with:
      tag: ${{ needs.version.outputs.tag }}
      sha: ${{ github.event.workflow_run.head_sha }}

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        # "Latest" only if no newer version came out meanwhile (one published by hand, say): GitHub's
        # releases/latest, the README badge and the app's update check all follow it.
        run: |
          set -euo pipefail
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "${latest#v}" "${TAG#v}" | sort -V | tail -1)
          if [ -z "$latest" ] || [ "$newest" = "${TAG#v}" ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            echo "$latest is newer than $TAG: publishing $TAG without making it the latest release."
            gh release edit "$TAG" --draft=false --latest=false
          fi

      - name: Check the release as users get it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: .github/scripts/check-release.sh "$TAG"

  # After the GitHub release is out, so that a Store problem cannot hold it up.
  store:
    name: Microsoft Store
    needs: [version, build, publish]
    if: needs.build.outputs.store-package == 'true' && vars.STORE_PRODUCT_ID != ''
    uses: ./.github/workflows/store.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID }}

  # Shows on the release's page where it is, and opens an issue only when a step failed
  # (.github/scripts/rollout.sh), so nobody has to look through the runs. The Store's certification,
  # which takes hours to days, store-status.yml follows from there.
  report:
    name: Report
    needs: [version, build, publish, store]
    if: always() && (needs.version.result == 'failure' || needs.version.outputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the status list in the release notes
      issues: write   # an issue when a step fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Update the release's status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish.result }}
          STORE: ${{ needs.store.result }}
          WITH_STORE: ${{ needs.build.outputs.store-package == 'true' && vars.STORE_PRODUCT_ID != '' }}
        run: |
          set -euo pipefail
          rollout=.github/scripts/rollout.sh
          if [ -z "$TAG" ]; then
            "$rollout" problem 'Automatic release failed' 'Working out the next version failed, so nothing was released.'
            exit 0
          fi
          steps=github
          if [ "$WITH_STORE" = true ]; then steps+=,store-submitted,store-live; fi
          "$rollout" start "$TAG" "$steps"
          # When the GitHub release fails, the Store step never runs: say so where the failure is reported.
          also=''
          if [ "$WITH_STORE" = true ]; then also=' The Microsoft Store submission did not run either; re-running the failed jobs does both.'; fi
          if [ "$BUILD" != success ]; then
            "$rollout" fail "$TAG" github "Building the release files did not work ($BUILD): the release stays a draft that nobody sees. Fix the cause, then re-run the failed jobs.$also"
          elif [ "$PUBLISH" != success ]; then
            "$rollout" fail "$TAG" github "Publishing the release or checking its downloads did not work ($PUBLISH).$also"
          else
            "$rollout" ok "$TAG" github
          fi
          case $STORE in
            success) "$rollout" ok "$TAG" store-submitted ;;
            skipped) ;;
            *) "$rollout" fail "$TAG" store-submitted "Submitting to the Microsoft Store did not work ($STORE); the GitHub release is out regardless. Fix the cause, then re-run the failed jobs." ;;
          esac
