# Releases main automatically, driven by Conventional Commits: once CI has passed on a push to main,
# the commits since the last release tag decide. Any `fix:` or `perf:` makes a patch release, any
# `feat:` a minor one, a `!` after the type (`feat!:`) or a "BREAKING CHANGE:" footer a major one.
# Everything else (chore:, ci:, docs:, test:, refactor:, build:, style:) releases nothing.
#
# The release is created as a draft for the commit CI tested; release.yml builds the zips, attaches
# them and, once it is set up, submits the Store package; only then is the release published. So
# nobody sees a release without its downloads, and the Store and GitHub get the same version.
#
# Runs on workflow_run, not push: a commit is released only after CI passed on it. The default token
# is enough: the draft, the files and the publishing all happen in this run, so no other workflow has
# to start from them (a release published with the default token does not start release.yml's own
# release: trigger - GitHub's loop prevention - which is right, since it is built already).
name: Auto release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Decide the next version
    # Only a green CI run of a push to main of this repository: not a pull request's, not a fork's.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the draft release
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # the tags and the commits since the last one
          persist-credentials: false

      - name: Read the commits since the last release
        id: next
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$SHA" 2>/dev/null || true)
          range=${last:+$last..}$SHA
          echo "Last release: ${last:-none}; looking at $range"

          bump='none'
          while IFS= read -r -d '' message; do
            subject=${message%%$'\n'*}
            if [[ $subject =~ ^[a-z]+(\([^\)]*\))?!: ]] || grep -qE '^BREAKING[ -]CHANGE:' <<< "$message"; then
              bump='major'
              break
            elif [[ $subject =~ ^feat(\([^\)]*\))?: ]]; then
              bump='minor'
            elif [[ $subject =~ ^(fix|perf)(\([^\)]*\))?: ]] && [ "$bump" = none ]; then
              bump='patch'
            fi
          done < <(git log --format='%B%x00' "$range")

          if [ "$bump" = none ]; then
            echo "No fix:, perf: or feat: commit since ${last:-the start}: nothing to release."
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case $bump in
            major) major=$((major + 1)) minor=0 patch=0 ;;
            minor) minor=$((minor + 1)) patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"
          echo "A $bump release: $tag"

          # A draft left by a failed earlier run of this version is replaced.
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)" = true ]; then
            gh release delete "$tag" --yes
          fi
          notes=(--generate-notes)
          if [ -n "$last" ]; then notes+=(--notes-start-tag "$last"); fi
          gh release create "$tag" --draft --target "$SHA" --title "MirrorDL ${tag#v}" "${notes[@]}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and deliver
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write # the zips onto the release
    with:
      tag: ${{ needs.version.outputs.tag }}
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID }}

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
