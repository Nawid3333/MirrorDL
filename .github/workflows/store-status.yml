# Follows a release through the Microsoft Store's certification, which takes from hours to a few days,
# once store.yml has submitted it. Every 3 hours, and from the Actions tab whenever wanted, it looks for
# the newest release whose page (.github/scripts/rollout.sh) says it is in certification, asks the Store
# where that submission is, and marks it live there - or opens an issue for a failed certification, a
# submission that was replaced, or one that takes over a week. With no release waiting, it doesn't even
# sign in.
name: Store status

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

concurrency:
  group: store-status
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Ask the Store
    if: vars.STORE_PRODUCT_ID != ''
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # the status list in the release notes
      issues: write   # an issue when something is wrong
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Find a release the Store still has to finish
        id: waiting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(.github/scripts/rollout.sh waiting)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "${tag:-No release} waits for the Store."

      # Microsoft's action: installs the Microsoft Store Developer CLI (msstore).
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        if: steps.waiting.outputs.tag != ''

      - name: Ask the Store
        id: store
        if: steps.waiting.outputs.tag != ''
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          TAG: ${{ steps.waiting.outputs.tag }}
        run: ./.github/scripts/store.ps1 -Action status -ProductId $env:PRODUCT_ID -Version $env:TAG.TrimStart('v')

      - name: Update the release's status
        if: always() && steps.waiting.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.waiting.outputs.tag }}
          ASKED: ${{ steps.store.outcome }}
          STATE: ${{ steps.store.outputs.state }}
          STATUS: ${{ steps.store.outputs.status }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          set -euo pipefail
          rollout=.github/scripts/rollout.sh
          partner="[Partner Center](https://partner.microsoft.com/dashboard/products/$PRODUCT_ID/overview)"
          if [ "$ASKED" != success ]; then
            "$rollout" fail "$TAG" store-live 'Asking the Microsoft Store where the submission is did not work. If signing in failed, the key may have expired: docs/microsoft-store.md says how to replace it.'
            exit 0
          fi
          case $STATE in
            live)
              "$rollout" ok "$TAG" store-live ;;
            failed)
              "$rollout" fail "$TAG" store-live "The Microsoft Store says $STATUS. $partner shows why; fix it there and submit again, or publish a new release." ;;
            gone)
              "$rollout" fail "$TAG" store-live "The Store's current submission isn't ${TAG#v} anymore (it is at $STATUS): it was replaced or deleted. See $partner." ;;
            *)
              # In certification - or at a word this doesn't know, which a week without progress still catches.
              published=$(gh release view "$TAG" --json publishedAt --jq .publishedAt)
              days=$(( ($(date +%s) - $(date -d "$published" +%s)) / 86400 ))
              echo "Waiting for the Store: $STATUS, $days days after the release."
              if [ "$days" -ge 7 ]; then
                "$rollout" fail "$TAG" store-live "The Store's submission is still at $STATUS after more than a week; $partner may say why."
              fi ;;
          esac
